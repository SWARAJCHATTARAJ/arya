services:
  - type: web
    name: arya-backend
    env: python
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODE
        value: cloud
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
